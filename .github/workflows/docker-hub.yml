name: Build & Push to Docker Hub

# Builds the multi-arch image (amd64 + arm64) and pushes it to Docker Hub:
#   - on every push to `main`        ->  :latest + :sha-<commit>
#   - on version tags `v*`           ->  :latest + :<tag>
#   - manually via the Actions tab   ->  :latest + :sha-<commit>
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME   = your Docker Hub username (arjun0084)
#   DOCKERHUB_TOKEN      = Docker Hub access token with Read/Write/Delete
#                          (https://hub.docker.com/settings/security)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: arjun0084/telegram-downloader

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          TAGS="${{ env.IMAGE }}:latest"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAGS="$TAGS,${{ env.IMAGE }}:${GITHUB_REF#refs/tags/}"
          else
            TAGS="$TAGS,${{ env.IMAGE }}:sha-${GITHUB_SHA::7}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
