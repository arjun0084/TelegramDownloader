# Telegram Movie Downloader — pull the image from Docker Hub, no build needed.
# Run on the HOST (where Docker + the USB drive live):
#   ./run.sh              # first install / update: pull + start
#   docker compose up -d  # or plain compose
#
# Fill in your secrets in .env  (template provided: .env.example)
# Edit the download volume path below to wherever your media lives.

services:
  tgdl:
    # Image is built & pushed by CI (see .github/workflows/docker-hub.yml).
    image: arjun0084/telegram-downloader:latest
    container_name: tgdl
    restart: unless-stopped

    # ---- your secrets (copy .env.example -> .env and fill) ----
    env_file:
      - .env

    environment:
      # You can override here or rely on .env; keep it simple in .env
      TG_OUTPUT_DIR: /downloads

    # ---- THE IMPORTANT PART: where downloaded movies actually land ----
    # Point MEDIA_HOST_DIR (in .env) at your host media folder, e.g.
    #   MEDIA_HOST_DIR=/media/devmon/sda1-usb-Kingston_DataTra
    volumes:
      - ${MEDIA_HOST_DIR}:/downloads
      # keep the Telethon session so you don't re-auth on restart
      - tgdl_data:/data

volumes:
  tgdl_data:
